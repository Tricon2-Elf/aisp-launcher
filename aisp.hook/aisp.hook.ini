; aisp.hook.ini - settings for the launcher's in-game hook (aisp.hook.dll).
;
; Place this file next to the game executable, beside connection.txt. Every key is optional;
; a missing or empty key means the default described here. Each key also has an environment
; variable of the same meaning, named in brackets, which overrides the file when set: handy for
; a one-off run without editing anything.

[screens]
; Host the in-game screen pages are fetched from (room TVs, channel screens, the billboard).
; Default: the download host from connection.txt. [AISP_SCREEN_HOST]
host=

; Full base URL of the screen pages, for example http://127.0.0.1:8080/ai-sp/. Overrides host
; above; the path part defaults to the directory of the download path in
; connection.txt. [AISP_SCREEN_BASE]
base=

; 1 writes per-frame statistics to aisp.screen.log. [AISP_SCREEN_STATS]
stats=0

[tools]
; Programs the screens use, absolute or relative to the game directory.
; [AISP_FFMPEG] [AISP_STREAMLINK] [AISP_YTDLP] [AISP_ELECTRON]
ffmpeg=streamlink\ffmpeg\ffmpeg.exe
streamlink=streamlink\bin\streamlink.exe
ytdlp=yt-dlp\yt-dlp.exe
electron=aisp.electron\electron.exe

; ffmpeg's own log level in aisp.screen.log: info, warning, debug, ... [AISP_FFMPEG_LOGLEVEL]
ffmpeg_loglevel=info
