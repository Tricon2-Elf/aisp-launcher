name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The same containerised MinGW build the release script uses; MSVC does not compile the
      # hook (its exdisp.h breaks under CINTERFACE in C++), so the DLL is built here and the
      # Windows job only publishes the launcher.
      - name: Build hook DLL (x86, MinGW)
        run: ./scripts/build-hook.sh build/aisp.hook.dll

      - name: Upload hook DLL
        uses: actions/upload-artifact@v4
        with:
          name: hook-win-x86
          path: build/aisp.hook.dll
          if-no-files-found: error

  build-windows:
    needs: [build-hook]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish win-x86 launcher
        run: >
          dotnet publish aisp.launch/aisp.launch.csproj
          -c Release
          -p:PublishProfile=win-x86
          -p:DefaultWebsiteUrl=${{ vars.AISP_WEBSITE_URL || 'https://aisp.moe' }}
          -p:DefaultGitHubRepo=${{ vars.AISP_GITHUB_REPO || 'Tricon2-Elf/aisp-launcher' }}

      - name: Download hook DLL
        uses: actions/download-artifact@v4
        with:
          name: hook-win-x86
          path: aisp.launch/bin/publish/win-x86

      - name: Package win-x86 launcher bundle
        shell: pwsh
        run: |
          $bundleDir = "aisp.launch/bin/publish/win-x86/launcher-bundle"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          Copy-Item "aisp.launch/bin/publish/win-x86/aisp.launch.exe" $bundleDir -Force
          Copy-Item "aisp.launch/bin/publish/win-x86/aisp.hook.dll" $bundleDir -Force
          Compress-Archive -Path "$bundleDir/*" -DestinationPath "aisp.launch/bin/publish/win-x86/aisp.launch.win-x86.bundle.zip" -Force

      - name: Upload launcher bundle
        uses: actions/upload-artifact@v4
        with:
          name: launcher-win-x86
          path: aisp.launch/bin/publish/win-x86/aisp.launch.win-x86.bundle.zip
          if-no-files-found: error
